# Section registry: label, order and document type per top-level folder.
# Editing this file relabels or reorders a nav group without moving content.
version: 1
sections:
  - id: context
    label: The Unconference
    order: 10
    type: Context
    purpose: What SoCraTes BE 2026 is, where and when it happens, and how it works.

  - id: sessions
    label: Sessions
    order: 20
    type: Context
    purpose: Notes from marketplace sessions, written by the people who were there.

  - id: ideas
    label: Ideas
    order: 30
    type: Plan
    purpose: Session proposals, open questions and follow-ups that are not sessions yet.

  - id: guides
    label: Contribute
    order: 40
    type: Guide
    purpose: How humans and agents add to this second brain.

  - id: presentations
    label: Presentations
    order: 45
    type: Presentation
    purpose: Slide decks presented at, or about, SoCraTes BE 2026.

  - id: development
    label: Development
    order: 47
    type: Operations
    purpose: How this repository is run, so a crowd of people and agents can work on it safely.

  - id: adr
    label: Decisions
    order: 50
    type: ADR
    purpose: Why this site is built the way it is.
