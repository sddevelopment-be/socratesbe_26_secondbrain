name: Docsite

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docsite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Syntax checks and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Frontmatter against the DocKitty convention
        run: pnpm validate

      - name: Markdown syntax
        run: pnpm lint:md

      - name: Internal links (source)
        run: pnpm links

      - name: Type check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Internal links (built site)
        run: pnpm check:dist

      - name: Upload site for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  spelling:
    name: Spelling (UK English, advisory)
    runs-on: ubuntu-latest
    # Advisory only: findings show as warnings and never fail the run.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Spellcheck
        run: |
          set +e
          pnpm exec cspell --no-progress --no-summary --unique > cspell.log
          set -e
          count=$(grep -c ' - Unknown word' cspell.log || true)
          # file:line:col - Unknown word (x) -> a warning annotation on that line
          sed -nE 's/^([^:]+):([0-9]+):([0-9]+) - (Unknown word \(([^)]+)\).*)$/::warning file=\1,line=\2,col=\3,title=Spelling (en-GB)::\4/p' cspell.log
          {
            echo "### Spelling (UK English)"
            if [ "$count" -eq 0 ]; then
              echo "No unknown words."
            else
              echo "$count unknown word(s). Fix the spelling, or add project vocabulary to \`.cspell/project-words.txt\`."
              echo
              echo '```'
              cat cspell.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
