name: Docsite

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces its older run. Runs on main are
# never cancelled, so a deploy in progress always finishes.
concurrency:
  group: docsite-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Syntax checks and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Frontmatter against the DocKitty convention
        run: pnpm validate

      - name: Markdown syntax
        run: pnpm lint:md

      - name: Internal links (source)
        run: pnpm links

      - name: Type check
        run: pnpm check

      - name: Schedule data
        run: pnpm check:schedule

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Internal links (built site)
        run: pnpm check:dist

      - name: Upload site for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  schedule-fixture:
    name: Two-day schedule fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the fixture (never uploaded)
        run: node scripts/build-schedule-fixture.mjs

      - name: Check the fixture build
        run: node scripts/check-schedule-dist.mjs dist-fixture --fixture

  spelling:
    name: Spelling (UK English, advisory)
    runs-on: ubuntu-latest
    # Advisory only: findings show as warnings and never fail the run.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Spellcheck
        run: |
          set +e
          pnpm exec cspell --no-progress --no-summary --unique > cspell.log 2>&1
          rc=$?
          set -e
          count=$(grep -cE ' - (Unknown|Forbidden) word' cspell.log || true)
          # file:line:col - Unknown word (x) -> a warning annotation on that line
          sed -nE 's/^([^:]+):([0-9]+):([0-9]+) - ((Unknown|Forbidden) word \(([^)]+)\).*)$/::warning file=\1,line=\2,col=\3,title=Spelling (en-GB)::\4/p' cspell.log
          # Exit code 1 means "words found"; anything else means cspell itself failed.
          if [ "$rc" -gt 1 ] || { [ "$rc" -ne 0 ] && [ "$count" -eq 0 ]; }; then
            echo "::warning title=Spelling (en-GB)::cspell did not complete (exit $rc). See the job log."
            cat cspell.log
          fi
          {
            echo "### Spelling (UK English)"
            if [ "$rc" -ne 0 ] && [ "$count" -eq 0 ]; then
              echo "cspell did not complete (exit $rc):"
              echo
              echo '```'
              cat cspell.log
              echo '```'
            elif [ "$count" -eq 0 ]; then
              echo "No unknown words."
            else
              echo "$count spelling finding(s). Fix the spelling, or add project vocabulary to \`.cspell/project-words.txt\`."
              echo
              echo '```'
              cat cspell.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to GitHub Pages
    # Pushes to main deploy; a manual run on main redeploys.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
