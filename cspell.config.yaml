# Spellcheck in UK English. Advisory in CI: findings are reported as
# warnings and never block a merge. Add project vocabulary to words below
# (or to a page's frontmatter-free text with a `cspell:ignore` comment).
version: "0.2"
language: en-GB
import:
  - "@cspell/dict-en-gb/cspell-ext.json"
dictionaries:
  - project-words
dictionaryDefinitions:
  - name: project-words
    path: ./.cspell/project-words.txt
    addWords: true
files:
  - "docs/**/*.md"
  - "README.md"
ignorePaths:
  - "node_modules/**"
  - "dist/**"
  - "docs/_meta/**"
ignoreRegExpList:
  # fenced code, inline code and URLs are not prose
  - "/^\\s*```[\\s\\S]*?^\\s*```/gm"
  - "/`[^`\\n]+`/g"
  - "/https?:\\/\\/\\S+/g"
